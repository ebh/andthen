name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # Reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint (oxlint, then ESLint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated Worker types are current
        run: pnpm wrangler types --check

      - name: Test
        run: pnpm test

      # The export is the same for every environment; the environment is chosen at deploy time.
      - name: Build
        run: pnpm build

      # Validates each deployed environment's config without credentials.
      - name: Dry-run deploy (preview)
        run: pnpm wrangler deploy --dry-run --env preview

      - name: Dry-run deploy (production)
        run: pnpm wrangler deploy --dry-run --env production

  # Runs beside `check` so a slow mutation run doesn't hold up the fast checks.
  mutation:
    runs-on: ubuntu-latest
    # Sized for a full run: the first run on a branch with no cache, and every push to main.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stryker's diff only sees mutated and test files, so a change to its config, the Vitest config
      # or a dependency can leave stale results. The hash keeps those out of the exact-match restore.
      # The bare `stryker-` fallback still restores the newest file from main after such a change, so
      # a pull request is never cold; the next push to main reruns every mutant and corrects it.
      # Keys can't be overwritten, so each run saves under a unique key and restores by prefix.
      - name: Restore the incremental file
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('stryker.config.json', 'vitest*.ts', 'pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            stryker-${{ hashFiles('stryker.config.json', 'vitest*.ts', 'pnpm-lock.yaml') }}-
            stryker-

      # Pull requests reuse results for code and tests they didn't touch. A push to main reruns
      # every mutant, which also catches a changed helper under an unchanged test.
      - name: Mutation test
        run: pnpm stryker --incremental ${{ github.event_name == 'push' && '--force' || '' }}

      # Stryker writes a partial file when interrupted, so a cancelled or timed-out run still saves progress.
      - name: Save the incremental file
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('stryker.config.json', 'vitest*.ts', 'pnpm-lock.yaml') }}-${{ github.run_id }}

  # Runs beside `check` so a slow browser run doesn't hold up the fast checks.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser build is tied to the Playwright version, which the lockfile pins.
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # System libraries live outside the cached folder, so a cache hit still needs them.
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Builds the app and serves it from the Worker on a fresh local D1 with the fake AI provider.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
