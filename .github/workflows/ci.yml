name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Full history, so the legal check can diff against the base commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A published legal document version is never edited (.claude/rules/legal-documents.md). A new
      # branch has no `before` commit (all zeros), so there is nothing to compare against.
      - name: Legal versions unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare with; skipping."
          else
            pnpm legal:check "$BASE"
          fi

      - name: Format
        run: pnpm format:check

      - name: Lint (oxlint, then ESLint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated Worker types are current
        run: pnpm wrangler types --check

      - name: Test with coverage
        run: pnpm test:coverage

      # The export is the same for every environment; the environment is chosen at deploy time.
      - name: Build
        run: pnpm build

      # Validates each deployed environment's config without credentials.
      - name: Dry-run deploy (preview)
        run: pnpm wrangler deploy --dry-run --env preview

      - name: Dry-run deploy (production)
        run: pnpm wrangler deploy --dry-run --env production

  # Runs beside `check` so a slow mutation run doesn't hold up the fast checks. One shard per
  # source area runs in parallel, each with its own incremental file. Every shard still runs the
  # whole test suite: only the mutated files are split, so no mutant loses a test that could kill it.
  mutation-area:
    name: mutation-area (${{ matrix.area }})
    runs-on: ubuntu-latest
    # Sized for a full run: a run with no cache, a push to main after a config or dependency change,
    # or a change to a shared schema that most mutants depend on. A full run took over 40 minutes
    # before the job was split by area.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        area: [shared, worker, client, ui]
    env:
      STRYKER_AREA: ${{ matrix.area }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stryker's diff only sees mutated and test files, so a change to its config, the Vitest config
      # or a dependency can leave stale results. The hash keeps those out of the exact-match restore.
      # The `stryker-<area>-` fallback still restores the newest file from main after such a change,
      # so a pull request is never cold; the next push to main sees the fallback match and reruns
      # every mutant to correct it.
      # Keys can't be overwritten, so each run attempt saves under a unique key and restores by prefix.
      # A re-run keeps its run_id, so without the attempt number it could never save its progress.
      - name: Restore the incremental file
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ matrix.area }}-${{ hashFiles('stryker.config.json', 'stryker.area.config.ts', 'vitest*.ts', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-${{ matrix.area }}-${{ hashFiles('stryker.config.json', 'stryker.area.config.ts', 'vitest*.ts', 'pnpm-lock.yaml') }}-
            stryker-${{ matrix.area }}-

      # Pull requests and pushes to main reuse results for code and tests they didn't touch. A full
      # run of every mutant took longer than the timeout, so main forces one only when the restored
      # file came from a different config or dependency hash (or there was none). Accepted risk: a
      # changed helper under an unchanged test keeps its old result until that test or code changes.
      - name: Mutation test
        run: pnpm stryker stryker.area.config.ts --incremental ${{ github.event_name == 'push' && !startsWith(steps.restore.outputs.cache-matched-key, format('stryker-{0}-{1}-', matrix.area, hashFiles('stryker.config.json', 'stryker.area.config.ts', 'vitest*.ts', 'pnpm-lock.yaml'))) && '--force' || '' }}

      # On SIGINT or SIGTERM Stryker writes the results so far to the incremental file, so a cancelled
      # or timed-out run still saves progress.
      - name: Save the incremental file
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ matrix.area }}-${{ hashFiles('stryker.config.json', 'stryker.area.config.ts', 'vitest*.ts', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The ruleset requires a check named `mutation`; this one passes only if every shard did.
  mutation:
    needs: mutation-area
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every mutation shard passed
        env:
          SHARDS: ${{ needs.mutation-area.result }}
        run: test "$SHARDS" = success

  # Runs beside `check` so a slow browser run doesn't hold up the fast checks.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser build is tied to the Playwright version, which the lockfile pins.
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # System libraries live outside the cached folder, so a cache hit still needs them.
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Builds the app and serves it from the Worker on a fresh local D1 with the fake AI provider.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
